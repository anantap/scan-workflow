name: Mac app

# Builds Roll Converter on a Mac, converts a test roll with it, checks the files, and publishes the
# finished app as the latest GitHub release (tag build-<run number>). The app checks that release and
# updates itself.
on:
  push:
    paths:
      - 'mac/**'
      - 'converter-core.js'
      - 'compositor/burke-core.js'
      - 'vendor/**'
      - '.github/workflows/mac-app.yml'
  workflow_dispatch:

concurrency:
  group: mac-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build the app and the command-line tool
        run: |
          xcodebuild -version
          BUILD_NUMBER=${{ github.run_number }} ./mac/build.sh

      - name: Convert a test roll
        run: |
          ROLL="$RUNNER_TEMP/Test roll"
          mkdir -p "$ROLL"
          for i in 1 2 3; do cp mac/Fixtures/negative.dng "$ROLL/scan000$i.dng"; done
          mac/build/rollconvert "$ROLL" --compositor
          ls -la "$ROLL/Positief"

      - name: Check the files
        run: python3 mac/Fixtures/check.py "$RUNNER_TEMP/Test roll"

      - name: Check the app icon
        run: |
          APP="mac/build/Roll Converter.app"
          ls "$APP/Contents/Resources"
          test -f "$APP/Contents/Resources/AppIcon.icns"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIconName' "$APP/Contents/Info.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Contents/Info.plist")" = "${{ github.run_number }}"
          ls "$APP/Contents/Resources" | grep -q 'Geist-Regular.ttf'

      - name: Take a screenshot
        continue-on-error: true
        run: |
          open "mac/build/Roll Converter.app"
          sleep 8
          screencapture -x screenshot-start.png
          osascript -e 'quit app "Roll Converter"' || true
          sleep 2
          open "mac/build/Roll Converter.app" --args "$RUNNER_TEMP/Test roll"
          sleep 8
          screencapture -x screenshot-roll.png
          osascript -e 'quit app "Roll Converter"' || true

      - name: Package the app
        run: ditto -c -k --keepParent "mac/build/Roll Converter.app" Roll-Converter.zip

      - uses: actions/upload-artifact@v6
        with:
          name: Roll-Converter
          path: |
            Roll-Converter.zip
            screenshot-*.png
          retention-days: 30

      - name: Publish as the latest release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" Roll-Converter.zip \
            --target "$GITHUB_SHA" --latest \
            --title "Roll Converter, build ${{ github.run_number }}" \
            --notes "$(git log -1 --pretty=%s) (${GITHUB_REF_NAME})"
