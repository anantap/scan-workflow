# XcodeGen project for Roll Converter. Generate the Xcode project with:  xcodegen generate
name: RollConverter
options:
  bundleIdPrefix: nl.ananta
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Ad-hoc signed: runs on your own Mac without an Apple developer account.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO

targets:
  RollConverter:
    type: application
    platform: macOS
    scheme: {}
    sources:
      - path: App
      - path: Core
      # The converter's maths: the same scripts as the web converter.
      - path: Engine/engine.js
        buildPhase: resources
      - path: ../converter-core.js
        buildPhase: resources
      - path: ../compositor/burke-core.js
        buildPhase: resources
      - path: ../vendor/utif.js
        buildPhase: resources
      - path: ../vendor/pako_inflate.min.js
        buildPhase: resources
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Roll Converter
        CFBundleName: Roll Converter
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.photography
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSHumanReadableCopyright: For personal use.
    settings:
      base:
        PRODUCT_NAME: Roll Converter
        PRODUCT_BUNDLE_IDENTIFIER: nl.ananta.rollconverter
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  rollconvert:
    type: tool
    platform: macOS
    scheme: {}
    sources:
      - path: CLI
      - path: Core
    settings:
      base:
        PRODUCT_NAME: rollconvert
        PRODUCT_BUNDLE_IDENTIFIER: nl.ananta.rollconvert
