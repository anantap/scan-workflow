<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2c22"/><stop offset="1" stop-color="#17110d"/>
    </linearGradient>
    <!-- positive -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f7fd0"/><stop offset="1" stop-color="#9fd0f2"/>
    </linearGradient>
    <!-- negative: the same scene inverted, under an orange mask -->
    <linearGradient id="negsky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e0864a"/><stop offset="1" stop-color="#b9643a"/>
    </linearGradient>
    <clipPath id="frame"><rect x="160" y="318" width="704" height="388" rx="22"/></clipPath>
    <clipPath id="negHalf"><polygon points="160,318 864,318 160,706"/></clipPath>
    <clipPath id="posHalf"><polygon points="864,318 864,706 160,706"/></clipPath>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>

  <!-- film strip -->
  <rect x="-20" y="186" width="1064" height="652" fill="#0d0907"/>
  <g fill="#3d2e24"><rect x="40" y="212" width="72" height="44" rx="11"/><rect x="200" y="212" width="72" height="44" rx="11"/><rect x="360" y="212" width="72" height="44" rx="11"/><rect x="520" y="212" width="72" height="44" rx="11"/><rect x="680" y="212" width="72" height="44" rx="11"/><rect x="840" y="212" width="72" height="44" rx="11"/><rect x="40" y="768" width="72" height="44" rx="11"/><rect x="200" y="768" width="72" height="44" rx="11"/><rect x="360" y="768" width="72" height="44" rx="11"/><rect x="520" y="768" width="72" height="44" rx="11"/><rect x="680" y="768" width="72" height="44" rx="11"/><rect x="840" y="768" width="72" height="44" rx="11"/></g>

  <g transform="translate(110 290) scale(1.142) translate(-160 -318)">
  <g clip-path="url(#frame)">
    <!-- positive -->
    <g clip-path="url(#posHalf)">
      <rect x="160" y="318" width="704" height="388" fill="url(#sky)"/>
      <circle cx="640" cy="470" r="70" fill="#ffd25a"/>
      <path d="M160 640 C 300 560, 420 560, 560 620 S 780 600, 864 560 L 864 706 L 160 706 Z" fill="#4f9a4a"/>
      <path d="M160 690 C 330 630, 520 650, 864 640 L 864 706 L 160 706 Z" fill="#2f7036"/>
    </g>
    <!-- negative -->
    <g clip-path="url(#negHalf)">
      <rect x="160" y="318" width="704" height="388" fill="url(#negsky)"/>
      <circle cx="640" cy="470" r="70" fill="#5a3a3e"/>
      <path d="M160 640 C 300 560, 420 560, 560 620 S 780 600, 864 560 L 864 706 L 160 706 Z" fill="#d4728e"/>
      <path d="M160 690 C 330 630, 520 650, 864 640 L 864 706 L 160 706 Z" fill="#e89a9a"/>
    </g>
    <!-- the seam -->
    <line x1="864" y1="318" x2="160" y2="706" stroke="#ffffff" stroke-opacity="0.9" stroke-width="10"/>
  </g>
  <rect x="160" y="318" width="704" height="388" rx="22" fill="none" stroke="#000" stroke-opacity="0.35" stroke-width="4"/>
  </g>
</svg>
